[package]
name = "passbee"
version = "0.1.0"
edition = "2024"

[package.metadata.winres]
FileDescription = "Passbee password manager"
ProductName = "Passbee"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
eframe = "0.33"
hex = "0.4"
hmac = "0.12"
sha1 = "0.10"
data-encoding = "2"
image = "0.25"
rfd = "0.15"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "0.10"
tempfile = "3"
zeroize = { version = "1", features = ["derive"] }

[build-dependencies]
winres = "0.1"
