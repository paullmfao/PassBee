[package]
name = "passbee"
version = "0.1.0"
edition = "2024"

[package.metadata.winres]
FileDescription = "Passbee password manager"
ProductName = "Passbee"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
eframe = "0.33"
image = "0.25"
rfd = "0.15"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["derive"] }
tempfile = "3"

[build-dependencies]
winres = "0.1"
